name: Application Unit Tests

on:
  push:
    paths:
      - "docker/payment/**"
      - "docker/shipping/**"
      - ".github/workflows/application-tests.yml"
  pull_request:
    paths:
      - "docker/payment/**"
      - "docker/shipping/**"
      - ".github/workflows/application-tests.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  payment-tests:
    name: Payment service unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docker/payment
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: docker/payment/requirements.txt

      - name: Install test dependencies
        run: python -m pip install Flask requests pika prometheus_client opentracing instana

      - name: Run payment unit tests
        run: python -m unittest discover --start-directory tests --pattern "test_*.py" --verbose

  shipping-tests:
    name: Shipping service unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docker/shipping
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run shipping unit tests
        run: mvn --batch-mode --no-transfer-progress test
