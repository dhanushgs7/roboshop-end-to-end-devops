name: Jenkins Pipeline Static Validation

on:
  push:
    paths:
      - "jenkins/**"
      - "kubernetes/argocd-application.yaml"
      - ".github/workflows/jenkins-validation.yml"
  pull_request:
    paths:
      - "jenkins/**"
      - "kubernetes/argocd-application.yaml"
      - ".github/workflows/jenkins-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Check Jenkins pipeline and GitOps safety gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Groovy
        run: |
          sudo apt-get update
          sudo apt-get install -y groovy

      - name: Parse Jenkinsfile as Groovy
        run: |
          groovy -e 'new GroovyShell().parse(new File("jenkins/Jenkinsfile")); println "Jenkinsfile Groovy syntax is valid."'

      - name: Verify CI and GitOps deployment safety gates
        run: |
          set -eu
          grep -q "PUSH_IMAGES" jenkins/Jenkinsfile
          grep -q "UPDATE_GITOPS" jenkins/Jenkinsfile
          grep -q "UPDATE_GITOPS requires PUSH_IMAGES=true" jenkins/Jenkinsfile
          grep -q "github-gitops-token" jenkins/Jenkinsfile
          grep -q "GITOPS_BRANCH" jenkins/Jenkinsfile
          grep -q "git push" jenkins/Jenkinsfile
          ! grep -qE 'kubectl[[:space:]]+apply|eks[[:space:]]+update-kubeconfig|terraform[[:space:]]+apply' jenkins/Jenkinsfile
          grep -q "targetRevision: gitops" kubernetes/argocd-application.yaml
          grep -q "selfHeal: true" kubernetes/argocd-application.yaml
          grep -q "prune: true" kubernetes/argocd-application.yaml
          echo "Jenkins publishes GitOps state; Argo CD owns EKS reconciliation."
