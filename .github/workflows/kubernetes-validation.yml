name: Kubernetes Manifest Validation

on:
  push:
    paths:
      - "kubernetes/**/*.yaml"
      - ".github/workflows/kubernetes-validation.yml"
  pull_request:
    paths:
      - "kubernetes/**/*.yaml"
      - ".github/workflows/kubernetes-validation.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Install kubeconform
        run: go install github.com/yannh/kubeconform/cmd/kubeconform@v0.6.7

      - name: Validate Kubernetes manifests
        run: |
          set -eu
          find kubernetes -type f \( -name '*.yaml' -o -name '*.yml' \) ! -name 'argocd-application.yaml' -print0 |
            xargs -0 -r "$(go env GOPATH)/bin/kubeconform" -strict -summary

      - name: Validate Argo CD Application declaration
        run: |
          set -eu
          test "$(grep -c '^kind: Application$' kubernetes/argocd-application.yaml)" -eq 1
          grep -q '^apiVersion: argoproj.io/v1alpha1$' kubernetes/argocd-application.yaml
          grep -q 'targetRevision: gitops' kubernetes/argocd-application.yaml
          grep -q 'path: kubernetes' kubernetes/argocd-application.yaml
          grep -q 'recurse: true' kubernetes/argocd-application.yaml
          grep -q 'exclude: argocd-application.yaml' kubernetes/argocd-application.yaml
