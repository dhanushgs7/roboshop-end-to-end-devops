name: Kubernetes Manifest Validation

on:
  push:
    paths:
      - "kubernetes/**/*.yaml"
      - "monitoring/kubernetes/**/*.yaml"
      - ".github/workflows/kubernetes-validation.yml"
  pull_request:
    paths:
      - "kubernetes/**/*.yaml"
      - "monitoring/kubernetes/**/*.yaml"
      - ".github/workflows/kubernetes-validation.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Install kubeconform
        run: go install github.com/yannh/kubeconform/cmd/kubeconform@v0.6.7

      - name: Validate Kubernetes manifests
        run: |
          set -eu
          find kubernetes -type f \( -name '*.yaml' -o -name '*.yml' \) -print0 |
            xargs -0 -r "$(go env GOPATH)/bin/kubeconform" -strict -summary

