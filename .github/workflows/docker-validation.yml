name: Docker Build and Security Validation

on:
  push:
    paths:
      - "docker/**"
      - "monitoring/kubernetes/**"
      - ".github/workflows/docker-validation.yml"
  pull_request:
    paths:
      - "docker/**"
      - ".github/workflows/docker-validation.yml"

permissions:
  contents: read

jobs:
  build-and-scan:
    name: Build and scan application images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v1

      - name: Validate Compose configuration
        working-directory: docker
        run: docker compose --env-file .env.example config --quiet

      - name: Build all application images from source
        working-directory: docker
        run: docker compose --env-file .env.example build --pull

      - name: Build hardened Grafana image
        run: docker build -t joindevops/grafana:v1 ./docker/grafana

      - name: Scan all application and monitoring images with Trivy
        env:
          IMAGE_TAG: joindevops
        run: |
          set -uo pipefail
          mkdir -p trivy-reports
          scan_failed=0

          scan_image() {
            image="$1"
            report="$2"
            echo "::group::Scanning ${image}"
            if docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "${PWD}/trivy-reports:/reports" \
              aquasec/trivy:0.76.1 image \
              --scanners vuln \
              --ignore-unfixed \
              --severity HIGH,CRITICAL \
              --exit-code 1 \
              --format json \
              --output "/reports/${report}.json" \
              "${image}"; then
              echo "PASS: ${image}"
            else
              echo "::error::HIGH/CRITICAL fixable findings or scan error in ${image}"
              scan_failed=1
            fi
            echo "::endgroup::"
          }

          for service in catalogue user cart payment shipping dispatch frontend mongodb mysql; do
            scan_image "${IMAGE_TAG}/${service}:v1" "${service}"
          done

          scan_image "prom/prometheus:v3.15.1" "prometheus"
          scan_image "joindevops/grafana:v1" "grafana"

          if [ "${scan_failed}" -ne 0 ]; then
            echo "::error::One or more images have fixable HIGH/CRITICAL findings or could not be scanned."
            exit 1
          fi

      - name: Upload Trivy reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-reports
          path: trivy-reports/
          if-no-files-found: warn
          retention-days: 14
