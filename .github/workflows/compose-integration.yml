name: Docker Compose Integration Smoke Tests

on:
  push:
    paths:
      - "docker/**"
      - "tests/integration/**"
      - ".github/workflows/compose-integration.yml"
  pull_request:
    paths:
      - "docker/**"
      - "tests/integration/**"
      - ".github/workflows/compose-integration.yml"

permissions:
  contents: read

concurrency:
  group: compose-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-integration:
    name: Build stack and run service integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate Compose stack and CI port override
        run: |
          docker compose \
            --env-file docker/.env.example \
            -f docker/docker-compose.yml \
            -f docker/docker-compose.ci.yml \
            config --quiet

      - name: Build and start RoboShop services
        run: |
          docker compose \
            --env-file docker/.env.example \
            -f docker/docker-compose.yml \
            -f docker/docker-compose.ci.yml \
            up -d --build

      - name: Wait for services and run integration smoke tests
        run: npm --prefix tests/integration run test:integration

      - name: Verify Dispatch consumes a RabbitMQ order event
        run: |
          set -eu
          docker exec payment python -c '
          import json, os, pika
          credentials = pika.PlainCredentials("roboshop", os.environ["AMQP_PASS"])
          connection = pika.BlockingConnection(pika.ConnectionParameters(host="rabbitmq", credentials=credentials))
          channel = connection.channel()
          channel.exchange_declare(exchange="robot-shop", exchange_type="direct", durable=True)
          channel.queue_declare(queue="orders", durable=True)
          channel.queue_bind(queue="orders", exchange="robot-shop", routing_key="orders")
          message = {"orderid": "ci-dispatch-smoke", "user": "ci", "cart": {"items": []}}
          channel.basic_publish(exchange="robot-shop", routing_key="orders",
                                properties=pika.BasicProperties(delivery_mode=2),
                                body=json.dumps(message).encode())
          connection.close()
          '
          for attempt in $(seq 1 30); do
            if docker logs dispatch 2>&1 | grep -q "dispatch accepted order_id=ci-dispatch-smoke"; then
              echo "Dispatch consumed and acknowledged the synthetic CI order."
              exit 0
            fi
            sleep 1
          done
          docker logs dispatch
          echo "Dispatch did not consume the synthetic CI order within 30 seconds."
          exit 1

      - name: Collect service status and logs on failure
        if: failure()
        run: |
          docker compose \
            --env-file docker/.env.example \
            -f docker/docker-compose.yml \
            -f docker/docker-compose.ci.yml \
            ps
          docker compose \
            --env-file docker/.env.example \
            -f docker/docker-compose.yml \
            -f docker/docker-compose.ci.yml \
            logs --no-color --tail=150

      - name: Stop CI stack and remove ephemeral volumes
        if: always()
        run: |
          docker compose \
            --env-file docker/.env.example \
            -f docker/docker-compose.yml \
            -f docker/docker-compose.ci.yml \
            down --volumes --remove-orphans
