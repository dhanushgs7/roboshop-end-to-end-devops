apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ebs-csi-test-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gp3-csi
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: ebs-csi-test
spec:
  containers:
    - name: storage-test
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - "echo 'EBS CSI persistence test successful' > /data/test.txt && cat /data/test.txt && sleep 3600"
      volumeMounts:
        - name: test-volume
          mountPath: /data
  volumes:
    - name: test-volume
      persistentVolumeClaim:
        claimName: ebs-csi-test-pvc
