apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: roboshop
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/dhanushgs7/roboshop-end-to-end-devops.git
    targetRevision: gitops
    path: kubernetes
    directory:
      recurse: true
      exclude: argocd-application.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: roboshop
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - ApplyOutOfSyncOnly=true
