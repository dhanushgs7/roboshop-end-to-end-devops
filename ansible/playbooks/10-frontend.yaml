- name: configure frontend server
  hosts: frontend
  become: yes
  tasks:
  - name: Require an operator-supplied RoboShop artifact base URL
    ansible.builtin.assert:
      that:
        - roboshop_artifact_base_url | default('') | length > 0
      fail_msg: "Set roboshop_artifact_base_url to your own trusted artifact repository before running this legacy EC2 playbook."
  - name: enable nginx 1.24
    command: dnf module enable nginx:1.24 -y
  - name: install nginx
    package:
      name: nginx
      state: present
  - name: remove html directory
    file:
      path: /usr/share/nginx/html/
      state: absent
  - name: delete frontend.zip in tmp directory
    file:
      path: /tmp/frontend.zip
      state: absent
  - name: create html directory
    file:
      path: /usr/share/nginx/html/
      state: directory
  - name: download frontend
    get_url:
      url: "{{ roboshop_artifact_base_url }}/frontend-v3.zip"
      dest: /tmp/frontend.zip
  - name: unzip frontend
    unarchive:
      src: /tmp/frontend.zip
      dest: /usr/share/nginx/html/
      remote_src: yes
  - name: remove nginx default conf
    file:
      path: /etc/nginx/nginx.conf
      state: absent
  - name: copy nginx conf
    template:
      src: nginx.conf.j2
      dest: /etc/nginx/nginx.conf
  - name: restart and enable frontend
    service:
      name: nginx
      state: restarted
      enabled: yes
