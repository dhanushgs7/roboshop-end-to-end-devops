
- name: configuring mysql server
  hosts: mysql
  become: yes
  tasks:
    - name: Require the MySQL root password from the operator environment
      ansible.builtin.assert:
        that:
          - MYSQL_ROOT_PASSWORD | default('') | length > 0
        fail_msg: "Export MYSQL_ROOT_PASSWORD before running the MySQL playbook."
    - name: install mysql server
      package:
        name: mysql-server
        state: present

    - name: start and enable mysql server
      service:
        state: started
        enabled: yes
        name: mysqld

    - name: setup root password
      command: mysql_secure_installation --set-root-pass "{{ MYSQL_ROOT_PASSWORD }}"
      no_log: true
