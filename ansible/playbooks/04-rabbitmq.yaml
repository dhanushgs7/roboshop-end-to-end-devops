- name: configuring rabbitmq server
  hosts: rabbitmq
  become: yes
  tasks:
  - name: Require the RabbitMQ password from the operator environment
    ansible.builtin.assert:
      that:
        - RABBITMQ_PASSWORD | default('') | length > 0
      fail_msg: "Export RABBITMQ_PASSWORD before running the RabbitMQ playbook."
  - name: copy rabbitmq repo
    copy:
      src: rabbitmq.repo
      dest: /etc/yum.repos.d/rabbitmq.repo
  - name: install rabbitmq server
    package:
      name: rabbitmq-server
      state: present
  - name: start and enable rabbitmq-server
    service:
      name: rabbitmq-server
      state: started
      enabled: yes
  - name: create roboshop mq user
    community.rabbitmq.rabbitmq_user:
      user: roboshop
      password: "{{ RABBITMQ_PASSWORD }}"
      permissions:
        - vhost: /
          configure_priv: .*
          read_priv: .*
          write_priv: .*
      state: present