---
- name: Prepare an Ubuntu Jenkins agent for RoboShop CI/CD tasks
  hosts: jenkins_agents
  become: true
  gather_facts: true
  vars:

  tasks:
    - name: Ensure supported Ubuntu distribution
      ansible.builtin.assert:
        that:
          - ansible_distribution == "Ubuntu"
          - ansible_distribution_version is version("24.04", ">=")
        fail_msg: "This playbook supports Ubuntu 24.04 or newer."

    - name: Install Jenkins agent and pipeline prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - git
          - unzip
          - jq
          - openjdk-21-jre
          - docker.io
          - docker-compose-v2
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Enable Docker service
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Download AWS CLI v2 installer
      ansible.builtin.get_url:
        url: https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip
        dest: /tmp/awscliv2.zip
        mode: "0644"
      when: ansible_architecture == "x86_64"

    - name: Extract AWS CLI v2 installer
      ansible.builtin.unarchive:
        src: /tmp/awscliv2.zip
        dest: /tmp
        remote_src: true
        creates: /tmp/aws/install
      when: ansible_architecture == "x86_64"

    - name: Install AWS CLI v2
      ansible.builtin.command: /tmp/aws/install --update
      args:
        creates: /usr/local/bin/aws
      when: ansible_architecture == "x86_64"

    - name: Download Trivy repository signing key
      ansible.builtin.get_url:
        url: https://aquasecurity.github.io/trivy-repo/deb/public.key
        dest: /usr/share/keyrings/trivy.asc
        mode: "0644"

    - name: Configure Trivy APT repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/trivy.asc] https://aquasecurity.github.io/trivy-repo/deb generic main"
        filename: trivy
        state: present

    - name: Install Trivy
      ansible.builtin.apt:
        name: trivy
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Ensure Jenkins agent account exists
      ansible.builtin.getent:
        database: passwd
        key: jenkins
      register: jenkins_user_lookup
      failed_when: false
      changed_when: false

    - name: Add existing Jenkins agent account to Docker group
      ansible.builtin.user:
        name: jenkins
        groups: docker
        append: true
      when: jenkins_user_lookup.ansible_facts.getent_passwd.jenkins is defined

    - name: Report remaining agent bootstrap requirements
      ansible.builtin.debug:
        msg:
          - "Install AWS CLI v2 and Trivy using their official vendor instructions."
          - "Register this machine with the Jenkins controller using a securely provisioned agent secret."
          - "Attach an appropriately scoped IAM role; do not configure static AWS access keys."
          - "Log out and back in (or restart the agent service) for Docker group membership to take effect."
