- name: configure shipping server
  hosts: shipping
  become: yes
  tasks:
  - name: Require shipping database credentials and endpoint
    ansible.builtin.assert:
      that:
        - MYSQL_HOST | default('') | length > 0
        - MYSQL_ROOT_PASSWORD | default('') | length > 0
        - DB_PASSWORD | default('') | length > 0
      fail_msg: "Set MYSQL_HOST, MYSQL_ROOT_PASSWORD and DB_PASSWORD in inventory/environment before deploying Shipping."
  - name: Require an operator-supplied RoboShop artifact base URL
    ansible.builtin.assert:
      that:
        - roboshop_artifact_base_url | default('') | length > 0
      fail_msg: "Set roboshop_artifact_base_url to your own trusted artifact repository before running this legacy EC2 playbook."
  - name: install maven
    package:
      name: "{{ item }}"
      state: present
    loop:
    - maven
    - mysql
    - python3
    - python3-pip
  - name: create roboshop system user
    user:
      name: roboshop
      system: true
      home: /app
      shell: /sbin/nologin
      comment: "Roboshop System user"
  - name: remove app directory
    file:
      path: /app
      state: absent
  - name: delete shipping.zip in tmp directory
    file:
      path: /tmp/shipping.zip
      state: absent
  - name: create app directory
    file:
      path: /app
      state: directory
  - name: download shipping
    get_url:
      url: "{{ roboshop_artifact_base_url }}/shipping-v3.zip"
      dest: /tmp/shipping.zip
  - name: unzip shipping
    unarchive:
      src: /tmp/shipping.zip
      dest: /app
      remote_src: yes
  - name: install dependencies
    command: mvn clean package
    args:
      chdir: /app
  - name: move shipping jar
    command: mv target/shipping-1.0.jar shipping.jar
    args:
      chdir: /app
  - name: copy shipping service
    template:
      src: shipping.service.j2
      dest: /etc/systemd/system/shipping.service
  - name: install python dependencies
    pip:
      name: PyMySQL
      executable: pip3
  - name: ensure database initialization directory exists
    file:
      path: /app/db
      state: directory
      owner: root
      group: root
      mode: "0755"
  - name: copy the shared database schema from the repository
    copy:
      src: "{{ playbook_dir }}/../../docker/mysql/db/00-schema.sql"
      dest: /app/db/00-schema.sql
      owner: root
      group: root
      mode: "0644"
  - name: copy the shared city master data from the repository
    copy:
      src: "{{ playbook_dir }}/../../docker/mysql/db/master-data.sql"
      dest: /app/db/master-data.sql
      owner: root
      group: root
      mode: "0644"
  - name: import schema and city master data into MySQL
    community.mysql.mysql_db:
      state: import
      name: cities
      login_user: shipping
      login_password: "{{ DB_PASSWORD }}"
      login_host: "{{ MYSQL_HOST }}"
      target: "{{ item }}"
    loop:
    - /app/db/00-schema.sql
    - /app/db/master-data.sql
  - name: deamon reload
    systemd_service:
      name: shipping
      daemon_reload: true
  - name: enable and start shipping
    service:
      name: shipping
      state: restarted
      enabled: yes
